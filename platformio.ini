; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:m5stack-cardputer]
board = m5stack-stamps3
lib_deps =
    m5stack/M5Cardputer@1.1.1
    m5stack/M5Unified@0.2.24
    m5stack/M5GFX@0.2.31
    z3t0/IRremote@4.7.1

[env:cardkb2]
board = esp32-c61-devkitc1
framework = espidf
board_build.flash_mode = dio
board_upload.flash_size = 4MB
upload_speed = 460800
build_flags =
extra_scripts = pre:scripts/cardkb2_project.py
; ESP-IDF's CMake component already compiles the shared core.
lib_ignore = JotCore

[env:cardkb2-host]
board = m5stack-stamps3
lib_deps =
    m5stack/M5Unified@0.2.22
    m5stack/M5UnitUnified@0.5.8
    m5stack/M5Unit-KEYBOARD@0.1.0
    m5stack/M5GFX@0.2.31
    m5stack/M5Utility@0.3.1
    m5stack/M5HAL@0.1.3
build_flags =
    ${env.build_flags}
    -DUSE_CARDKB2_UNIT=1
